
# Auto-merge workflow for Renovate dependency updates
#
# SETUP: Install the Renovate GitHub App from https://github.com/apps/renovate
# CONFIG: See .github/renovate.json for Renovate configuration options
#
# Renovate References:
#   - Official: https://www.renovatebot.com/
#   - Docs: https://docs.renovatebot.com/
#   - Repo: https://github.com/renovatebot/renovate
#   - Configuration: https://docs.renovatebot.com/configuration-options/
#   - GitHub App: https://github.com/apps/renovate
#
# Used actions:
#   - actions/checkout
#     repo: https://github.com/actions/checkout
#     releases: https://github.com/actions/checkout/tags
#
#   - fastify/github-action-merge-dependabot
#     repo: https://github.com/fastify/github-action-merge-dependabot
#     releases: https://github.com/fastify/github-action-merge-dependabot/tags

name: Auto Merge Renovate 🔄

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge:
    name: Auto Merge Renovate

    runs-on: ubuntu-latest

    timeout-minutes: 5

    permissions:
      contents: write # Required to squash/merge/rebase the renovate PR
      pull-requests: write # Required to approve and merge the pull request
      workflows: write # Required when the renovate PR itself modifies workflow files

    # Only run for Renovate PRs - security: prevent running on PRs from forks or other actors
    # Uses the PR creator (pull_request.user.login) rather than github.actor, which reflects
    # the last actor to touch the ref and can be spoofed via a crafted commit history.
    if: github.event.pull_request.user.login == 'renovate[bot]'

    steps:

      # repo: https://github.com/actions/checkout
      # releases: https://github.com/actions/checkout/tags
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
            persist-credentials: false

      # repo: https://github.com/fastify/github-action-merge-dependabot
      # releases: https://github.com/fastify/github-action-merge-dependabot/tags
      # This action works with both Dependabot and Renovate
      # The action waits for required status checks by default
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f  # v3.15.0
        with:
            # github-token: ${{ secrets.TOKEN_AUTOMERGE }}
            # Using built-in GITHUB_TOKEN for better security (auto-scoped, auto-expires)
            # Falls back to TOKEN_AUTOMERGE if GITHUB_TOKEN lacks permissions
            github-token: ${{ secrets.GITHUB_TOKEN }}
            merge-method: squash  # merge|squash|rebase
            target: minor
