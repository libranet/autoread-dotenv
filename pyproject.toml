# This is a comment.
# syntax-documentation:
#  - https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
#
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python. Multiline strings are treated as
# verbose regular expressions by Black. Use [ ] to denote a significant space
# character.
#
#   > just install
#   > uv sync
#   > uv sync --all-groups
#   > uv sync --with <groupname>


[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"


[project]
name = "autoread_dotenv"
version = "1.0.6.dev1"
description = "Automatically set env-vars at the beginning of every python-process in your in-project virtualenv."
readme = "docs/readme.md"
authors = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
maintainers = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["license.md"]
keywords = ["entrypoints", "dotenv", "sitecustomize"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "sitecustomize-entrypoints>=1.1.0",
]

[dependency-groups]
dev = [
    { include-group = "ipython" },
    { include-group = "linting" },
    { include-group = "packaging" },
    { include-group = "pre-commit" },
    { include-group = "security" },
    { include-group = "testing" },
    { include-group = "typing" },
    "toml-cli >=0.7.0",
]
docs = [
    "docutils!=0.21",  # Work-around for https://github.com/pypi/warehouse/issues/15749
    "markupsafe>=2.1",
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
    "mdformat-frontmatter>=2.0",
    "mdformat-tables>=1.0",
    "myst-parser>=3.0",
    "sphinx>=7.1",
    "sphinx-autoapi>=3.3",
    "sphinx-rtd-theme>=3.0",
    "tomli>=2.0; python_version<\"3.11\"",
]
ipython = [
    # "ipdb>=0.13",
    "ipython>=8.12",
    "rich>=13.9",
]
linting = [
    "ruff>=0.8",
]
packaging = [
    "pyroma>=4.2",
]
pre-commit = [
    "codespell>=2.4.3",
    "pre-commit>=3.5",
    "pre-commit-hooks>=5.0",
    "prek>=0.2",
]
security = [
    # "bandit[toml]>=1.7",
    # "safety>=2.3",
    "zizmor>=1.0",
]
testing = [
    "importlib_metadata>=6.0",  # backport used by tests/test_entrypoints.py on Python <3.10
    "packaging>=23.0",
    "pytest>=8.3",
    "pytest-clarity>=1.0",
    "pytest-cov>=5.0",
    "pytest-dotenv>=0.5",
    "pytest-xdist>=3.6",
]
typing = [
    "ty>=0.0",
]

# https://packaging.python.org/en/latest/guides/creating-and-discovering-plugins/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#advanced-plugins
# https://github.com/Darsstar/sitecustomize-entrypoints/blob/main/src/sitecustomize/__init__.py
[project.entry-points.sitecustomize]
autoread_dotenv = "autoread_dotenv:entrypoint"


[project.urls]
homepage = "https://github.com/libranet/autoread-dotenv"
repository = "https://github.com/libranet/autoread-dotenv"
documentation = "https://autoread-dotenv.readthedocs.io"
pypi = "https://pypi.org/project/autoread-dotenv/"
test-pypi = "https://test.pypi.org/project/autoread-dotenv/"


[tool.codespell]
ignore-words-list = "hove,astroid"
skip = "uv.lock"


[tool.coverage.html]
directory = "var/html/coverage"

[tool.coverage.xml]
output = "var/html/coverage/coverage.xml"

[tool.coverage.report]
# cfr. https://coverage.readthedocs.io/en/coverage-4.2/excluding.html
fail_under = 90
exclude_lines = [
    "pragma: no cover",
]
include = ["src/*"]

[tool.coverage.run]
branch = true
data_file = "var/cache/coverage/coverage.db"


[tool.mdformat]
# https://mdformat.readthedocs.io/en/stable/users/configuration_file.html
wrap = "keep"   # preserve line wrapping
number = false  # don't renumber ordered lists
end_of_line = "lf"


[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
log_cli = false  # enable to show log-output
log_cli_level = "NOTSET"
markers = [  # avoid warnings about unregistered markers
    "unit",
    "integration",
]
testpaths = ["tests"]
pythonpath = ["tests"]  # allows for importing helper-module
addopts = ""

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/#using-pyprojecttoml
cache-dir = "var/cache/ruff" # relative to project_root
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # COM812 may cause conflicts when used with the ruff formatter
    "CPY001",  # Missing copyright notice at top of file
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true  # allow *args,**kwargs without triggering ANN401

[tool.ruff.lint.isort]
# https://docs.astral.sh/ruff/settings/#lintisort
combine-as-imports = true
force-single-line = false
from-first = false
known-third-party = []
known-first-party = ["autoread_dotenv"]
# known-local-folder = ["_helpers"]

[tool.ruff.lint.pydocstyle]
# pep257 disables numpy/google-style section-formatting rules
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 5  # default is 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",  # Missing type annotation
    "D103",    # Missing docstring in public function
    "INP001",  # tests-dir should not be a python-package
    "PLC0415", # import should be at the top-level of a file
    "S101",    # Use of assert detected
]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = ["pathlib", "typing"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
# enforce consistent import-aliases
"pathlib" = "pl"  # shadows polars -> pl
"typing" = "tp"


[tool.ty]
# https://docs.astral.sh/ty/reference/configuration/

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.ty.src]
include = [
    "src",
    "tests",
]

[tool.uv]
# Settings reference: https://docs.astral.sh/uv/reference/settings/
keyring-provider = "subprocess"
managed = true
package = true
default-groups = "all"

# Fix critical Zip Slip vulnerability in nltk < 3.9.3 (transitive dep via safety)
# https://github.com/libranet/autoread-dotenv/security/dependabot/48
override-dependencies = ["nltk>=3.9.3"]

[tool.uv.audit]
# `uv.lock` forks resolution by Python version (3.9 / 3.10 / 3.11+, see requires-python).
# Every ID below only has a fix in a release that dropped Python 3.9 support, so on the
# python_full_version < "3.10" fork uv is stuck on the last version that still supports 3.9.
# `--ignore-until-fixed` does NOT help here: it only suppresses vulnerabilities with no fix
# release at all, and a fix does exist upstream -- it's just Python >=3.10 only. Revisit and
# drop these once Python 3.9 support is dropped (see .claude/todo-package-review.md).
ignore = [
    "PYSEC-2026-2132",   # click: fixed in 8.3.3, which requires Python >=3.10
    "GHSA-qmgc-5h2g-mvrw",  # filelock: TOCTOU symlink, fixed in 3.20.3 (Python >=3.10)
    "GHSA-w853-jp5j-5j7f",  # filelock: TOCTOU symlink, fixed in 3.20.1 (Python >=3.10)
    "GHSA-6w46-j5rx-g56g",  # pytest: tmpdir handling, fixed in 9.0.3 (Python >=3.10)
    "GHSA-mf9w-mj56-hr94",  # python-dotenv: symlink following in set_key(), fixed in 1.2.2 (Python >=3.10)
    "GHSA-gc5v-m9x4-r6x2",  # requests: insecure temp file reuse, fixed in 2.33.0 (Python >=3.10)
    "GHSA-h35f-9h28-mq5c",  # setuptools: MANIFEST.in exclusion bypass, fixed in 83.0.0 (Python >=3.10)
    "GHSA-mf9v-mfxr-j63j",  # urllib3: decompression-bomb safeguard bypass, fixed in 2.7.0 (Python >=3.10)
    "GHSA-qccp-gfcp-xxvc",  # urllib3: sensitive headers forwarded on redirect, fixed in 2.7.0 (Python >=3.10)
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
