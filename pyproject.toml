# This is a comment.
# syntax-documentation:
#  - https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
#
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python. Multiline strings are treated as
# verbose regular expressions by Black. Use [ ] to denote a significant space
# character.
#
#   > just install
#   > uv sync
#   > uv sync --all-groups
#   > uv sync --with <groupname>


[build-system]
requires = ["uv_build>=0.9.0,<0.13.0"]
build-backend = "uv_build"


[project]
name = "autoread-dotenv"
version = "1.1.0.dev1"
description = "Automatically load your .env when Python starts."
readme = "docs/readme.md"
authors = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
maintainers = [{ name = "Wouter Vanden Hove", email = "wouter@libranet.eu" }]
requires-python = ">=3.11"
license = "MIT"
license-files = ["license.md"]
keywords = ["dotenv", "entrypoints", "environment", "python", "sitecustomize"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv>=1.2.2",
    "sitecustomize-entrypoints>=1.1.0",
]

[dependency-groups]
dev = [
    { include-group = "ipython" },
    { include-group = "linting" },
    { include-group = "packaging" },
    { include-group = "pre-commit" },
    { include-group = "security" },
    { include-group = "testing" },
    { include-group = "typing" },
    "toml-cli >=0.7.0",
]
docs = [
    "mdformat>=0.7",
    "mdformat-gfm>=0.3",
    "mdformat-frontmatter>=2.0",
    "mdformat-tables>=1.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
ipython = [
    # "ipdb>=0.13",
    "ipython>=8.12",
    "rich>=13.9",
]
linting = [
    "ruff>=0.8",
]
packaging = [
    "pyroma>=4.2",
]
pre-commit = [
    "codespell>=2.4.3",
    "pre-commit>=3.5",
    "pre-commit-hooks>=5.0",
    "prek>=0.2",
]
security = [
    # "bandit[toml]>=1.7",
    # "safety>=2.3",
    "zizmor>=1.0",
]
testing = [
    "hypothesis>=6.85",  # property-based tests (tests/test_properties.py)
    "packaging>=23.0",
    "pytest>=8.3",
    "pytest-clarity>=1.0",
    "pytest-cov>=5.0",
    "pytest-dotenv>=0.5",
    "pytest-xdist>=3.6",
]
typing = [
    "ty>=0.0",
]

# https://packaging.python.org/en/latest/guides/creating-and-discovering-plugins/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#advanced-plugins
# https://github.com/Darsstar/sitecustomize-entrypoints/blob/main/src/sitecustomize/__init__.py
[project.entry-points.sitecustomize]
autoread_dotenv = "autoread_dotenv:entrypoint"


[project.urls]
homepage = "https://github.com/libranet/autoread-dotenv"
repository = "https://github.com/libranet/autoread-dotenv"
issues = "https://github.com/libranet/autoread-dotenv/issues"
security = "https://github.com/libranet/autoread-dotenv/blob/main/docs/security.md"
changelog = "https://github.com/libranet/autoread-dotenv/blob/main/docs/changes.md"
documentation = "https://autoread-dotenv.readthedocs.io"
pypi = "https://pypi.org/project/autoread-dotenv/"
test-pypi = "https://test.pypi.org/project/autoread-dotenv/"


[tool.codespell]
ignore-words-list = "fasle, hove,ture"
skip = "uv.lock, var"


[tool.coverage.html]
directory = "var/html/coverage"

[tool.coverage.xml]
output = "var/html/coverage/coverage.xml"

[tool.coverage.report]  # cfr. https://coverage.readthedocs.io/en/coverage-4.2/excluding.html
fail_under = 90
exclude_lines = [
    "pragma: no cover",
]
include = ["src/*"]

[tool.coverage.run]
branch = true
data_file = "var/cache/coverage/coverage.db"


[tool.mdformat]  # https://mdformat.readthedocs.io/en/stable/users/configuration_file.html
wrap = "keep"   # preserve line wrapping
number = false  # don't renumber ordered lists
end_of_line = "lf"


[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
log_cli = false  # enable to show log-output
log_cli_level = "NOTSET"
markers = [  # avoid warnings about unregistered markers
    "unit",
    "integration",
]
testpaths = ["tests"]
pythonpath = ["tests"]  # allows for importing helper-module
addopts = ""

[tool.ruff]  # https://docs.astral.sh/ruff/configuration/#using-pyprojecttoml
cache-dir = "var/cache/ruff" # relative to project_root
line-length = 120

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # COM812 may cause conflicts when used with the ruff formatter
    "CPY001",  # Missing copyright notice at top of file
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true  # allow *args,**kwargs without triggering ANN401

[tool.ruff.lint.isort]  # https://docs.astral.sh/ruff/settings/#lintisort
combine-as-imports = true  # combine related imports
force-single-line = false  # do not expand imports into one-per-line unnecessarily
from-first = false  # do not force from x import y before import x
known-third-party = []
known-first-party = ["autoread_dotenv"]

[tool.ruff.lint.pydocstyle]
# pep257 disables numpy/google-style section-formatting rules
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 5  # default is 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",  # tests use local fixtures and helper functions without full annotations
    "D103",    # pytest-style tests intentionally do not require public docstrings
    "INP001",  # tests-dir should not be a python-package
    "PLC0415", # tests commonly import helpers lazily for fixture setup
    "S101",    # pytest assertions are the expected pattern in tests
]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = ["pathlib", "typing"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
# enforce consistent import-aliases
"pathlib" = "pl"  # shadows polars -> pl
"typing" = "tp"


[tool.ty]  # https://docs.astral.sh/ty/reference/configuration

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-attribute = "error"
unresolved-import = "error"

[tool.ty.src]
include = [
    "src",
    "tests",
]

[tool.uv]  # Settings reference: https://docs.astral.sh/uv/reference/settings
default-groups = "all"
keyring-provider = "subprocess"
managed = true
package = true

# Fix critical Zip Slip vulnerability in nltk < 3.9.3 (transitive dep via safety)
# https://github.com/libranet/autoread-dotenv/security/dependabot/48
override-dependencies = ["nltk>=3.9.3"]

[tool.uv.sources]  # Settings reference: https://docs.astral.sh/uv/reference/settings/#sources
# Enable temporary local path overrides for development, but do not commit.
# The name-key must match the actual normalized project.name in pyproject.toml.
# git clone git@github.com:libranet/sitecustomize-entrypoints.git .deps/sitecustomize-entrypoints
# sitecustomize-entrypoints = { path = ".deps/sitecustomize-entrypoints", editable = true }


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
