# MkDocs + Material configuration.
#
# Docs:
#   - https://www.mkdocs.org/user-guide/configuration/
#   - https://squidfunk.github.io/mkdocs-material/setup/
#   - https://mkdocstrings.github.io/
#
# Usage:
#   $ just mkdocs-serve  (live preview)
#   $ just docs          (build static site)

copyright: Copyright &copy; Libranet

site_name: autoread-dotenv
site_author: Wouter Vanden Hove
site_description: Automatically load your .env when Python starts.
# Bare domain (no /en/latest/ path) so `mkdocs serve` is reachable at http://127.0.0.1:8000/
# instead of redirecting to a version sub-path. Read the Docs injects its own per-version
# canonical URL at build time.
site_url: https://autoread-dotenv.readthedocs.io/

repo_url: https://github.com/libranet/autoread-dotenv
repo_name: libranet/autoread-dotenv
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: var/html-docs

markdown_extensions:
    - admonition
    - attr_list
    - md_in_html
    - tables
    - toc:
          permalink: true
          toc_depth: "2-6"  # keep the page's H1 title out of the [TOC] / sidebar
    - pymdownx.details
    - pymdownx.highlight:
          anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - pymdownx.superfences
    - pymdownx.tabbed:
          alternate_style: true

nav:
    - Home: index.md
    - readme.md
    - configuration.md
    - performance.md
    - changes.md
    - security.md
    - License: license.md
    - Contribute:
          - contributors.md
          - contributing.md
          - code-of-conduct.md
    - API reference:
          - autoread_dotenv: reference/index.md
          - autoread_dotenv.utils: reference/utils.md
          - autoread_dotenv.status: reference/status.md
          - autoread_dotenv.warnings: reference/warnings.md
          - autoread_dotenv.about: reference/about.md

plugins:
    - search
    - mkdocstrings:
          default_handler: python
          handlers:
              python:
                  paths: [src]
                  options:
                      docstring_style: google
                      docstring_section_style: table
                      members_order: source
                      merge_init_into_class: true
                      separate_signature: true
                      show_root_heading: true
                      show_source: true
                      show_signature_annotations: true
                      signature_crossrefs: true


theme:
    name: material
    logo: img/favicon.png
    favicon: img/favicon.png
    features:
        - content.action.edit
        - content.code.copy
        - navigation.instant
        - navigation.sections
        - navigation.top
        - navigation.tracking
        - search.suggest
        - toc.follow
    palette:
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: teal
          accent: teal
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: teal
          accent: teal
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
